services:
  app:
    build:
      context: ../..
    restart: unless-stopped
    env_file: .env
    environment:
      HOST: 0.0.0.0
      PORT: 8080
      NODE_ENV: production
      COOKIE_SECURE: "1"
    volumes:
      - wardrobe-data:/app/server/data
    expose:
      - "8080"
  proxy:
    image: caddy:2
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app
volumes:
  wardrobe-data:
  caddy-data:
  caddy-config:
